# This is a TEMPLATE yaml. Some fields will be automatically replaced with actual values when the pipeline is run.
# These are: input_pdb and target_path (target pdb), output_prefix - generated based on info about the run, 
# hotspot_res - taken from txt files, scaffold_dir - directory with scaffold .pt files
# Per-scaffold mask_loops / sampled_* can be overridden via pipeline_config
# rfdiffusion.designs_config.<design>.insertions_for_scaffolds
# Other fields should be specified manually right here if user wants any changes from the default values,
# e.g. antihotspots, num_designs, mask_loops, sampled_insertion, sampled_N, sampled_C, etc.

defaults:
  - base

inference:
  input_pdb: /storage/hCG/truncated_renumbered_loops_B_chain.pdb
  output_prefix: /storage/hCG/rfdiffusion/outputs/scaffold_guided__truncated_renumbered_loops__loop1_loop3_set1
  num_designs: 10

ppi:
  # Hotspot residues on the hCG target.
  hotspot_res: [B20,B21,B22,B77]   # loop3_set1 — adjust as desired

# Post-RFdiffusion binder–target contact analysis (pipeline only; RFdiffusion ignores this block).
antihotspots:
  enabled: true
  contact_distance: 10.0
  # Max fraction of configured antihotspot residues allowed when all hotspots are contacted.
  max_antihotspot_contact_fraction: 0.25
  # Reference target residues to monitor; flag designs that contact too many of these.
  res: [B80-B87, B61-B66, B11-B16, B30-B33]   # adjust per campaign — reference PDB numbering

scaffoldguided:
  scaffoldguided: True

  # Parent directory with one subfolder per scaffold (each containing *_ss.pt / *_adj.pt).
  # Per-scaffold paths are injected when generating configs from designs_config.scaffolds.
  scaffold_dir: /storage/hCG/scaffold_ss_adj_backup/nanobody
  systematic: True

  # Provide the hCG target so the binder is generated in context
  target_pdb: True
  target_path: /storage/hCG/truncated_renumbered_loops_B_chain.pdb
  target_ss:  /storage/hCG/rfdiffusion/target_ss_adj/truncated_renumbered_loops_ss.pt
  target_adj: /storage/hCG/rfdiffusion/target_ss_adj/truncated_renumbered_loops_adj.pt

  # Keep loops flexible — allow the model to extend loop regions as needed
  mask_loops: True

  # Optional: allow small insertions/extensions to increase diversity
  sampled_insertion: 5   # up to 5 residues inserted into loops
  sampled_N: 3           # up to 3 residues added at N-terminus
  sampled_C: 3           # up to 3 residues added at C-terminus

denoiser:
  # Recommended for scaffold-guided PPI
  noise_scale_ca: 0.5
  noise_scale_frame: 0.5

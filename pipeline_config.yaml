structure_filters:
  enabled: true
  structure_docker_image: structure_tools
proteinmpnn:
  docker_image: rosettacommons/proteinmpnn
  chain_list: A
  num_seq_per_target: 10
  omit_AAs: X
  # Extra AAs to omit when the scaffold name appears in the partition / design name.
  omit_AA:
    affimer: C
    affibody: C
    affitin: C
    monobody: C
    nanobody: C
  sampling_temp: '0.1'
  use_soluble_model: true
  extra_args: []
soluprot:
  docker_image: soluprot
  enabled: true
  min_soluble_score: 0.5
  no_proc: 1
  fail_if_all_filtered: false
msa:
  server_url: http://127.0.0.1:18080/api
  pairing_strategy: greedy
  use_env: true
  request_timeout_seconds: 120.0
  max_retries: 20
  poll_interval_seconds: 5.0
  retry_backoff_seconds: 2.0
  max_paired_seqs: 8192
  max_msa_seqs: 16384
boltz2:
  template_yaml: /storage/proteindesign/dagster_pipeline/dagster_pipeline/default_boltz2_template.yaml
  target_fasta: /storage/hCG/loops_epitope_target_alpha_beta.fasta
  target_pdb: /storage/hCG/hCG_no_glycans.pdb
  fasta_extensions:
  - .fa
  - .fasta
  - .faa
  docker_image: boltz2
  use_potentials: false
  override: false
  recycling_steps: 3
  diffusion_samples: 5
  num_workers: 0
  preprocessing_threads: 2
  devices: 1
  query_chunk_size: 10
esmfold:
  docker_image: esmfold2
  model: biohub/ESMFold2
  num_loops: 20
  num_sampling_steps: 100
  num_diffusion_samples: 5
  seed: 0
  query_chunk_size: 10
  renumber_outputs: true
final_scores:
  docker_image: final_scores
  cpus: 4
  dalphaball_path: /usr/local/lib/final_scores/DAlphaBall.gcc
  ipsae_script: /storage/shaburova/antibodies/IPSAE/ipsae.py
  skip_ipsae: false
  hotspots: []
  antihotspots: []
filtered_designs:
  enabled: true
  thresholds_json: /storage/proteindesign/zebra_developability/pyrosetta_thresholds.json
  predictor: auto
  min_hotspot_contact_fraction: 0.75
  max_binder_seq_len: 125
  min_interface_hbonds: 1
  skip_dg_threshold: true

      target_pdb: /storage/hCG/hCG_no_glycans.pdb
      hotspots_txts_dir: /storage/hCG/hotspots/both_loops/
      antihotspots:
        enabled: true
        contact_distance: 10.0
        max_antihotspot_contact_fraction: 0.05
        res:
        - B80-B87
        - B61-B66
        - B11-B16
        - B30-B33

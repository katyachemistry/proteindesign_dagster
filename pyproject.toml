[project]
name = "proteindesign-dagster"
version = "0.1.0"
description = "Dagster asset pipeline for RFdiffusion → ProteinMPNN → ColabFold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dagster>=1.8.0",
  "dagster-webserver>=1.8.0",
  "pydantic>=2.0",
  # Host-side optional; lh_binding_scores itself runs in final_scores Docker.
  "numpy",
  "scipy",
  "biopython",
]

[project.optional-dependencies]
dev = ["dagster-daemon"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dagster_pipeline*"]
